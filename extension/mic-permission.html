<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Microphone Access - Rogov Recorder</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111827; color: #e5e7eb;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #1f2937; border-radius: 12px; padding: 32px;
      max-width: 420px; text-align: center;
      border: 1px solid #374151;
    }
    h2 { color: #fff; margin-bottom: 12px; font-size: 20px; }
    p { color: #9ca3af; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
    .btn {
      padding: 12px 32px; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      background: #059669; color: #fff;
    }
    .btn:hover { background: #047857; }
    .result {
      margin-top: 20px; padding: 12px; border-radius: 8px;
      font-size: 14px; font-weight: 600; display: none;
    }
    .result-ok { background: rgba(16,185,129,0.15); color: #34d399; }
    .result-fail { background: rgba(239,68,68,0.15); color: #f87171; }
    .hint {
      color: #6b7280; font-size: 12px; margin-top: 12px;
      line-height: 1.5; display: none; text-align: left;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Microphone Access</h2>
    <p>
      The extension needs microphone access to record your voice during calls.
      Without it, only the other party's audio from the tab will be recorded.
    </p>
    <button class="btn" id="btnAllow">Allow Microphone</button>
    <div id="result" class="result"></div>
    <div id="hint" class="hint"></div>
  </div>
  <script src="mic-permission.js"></script>
</body>
</html>
